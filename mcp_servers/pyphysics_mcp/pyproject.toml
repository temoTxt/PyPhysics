[project]
name = "pyphysics-mcp"
version = "0.1.0"
description = "MCP server exposing the PyPhysics repo's bibliography + chapter + validation tools as Claude-callable tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
pyphysics-mcp = "pyphysics_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyphysics_mcp"]
