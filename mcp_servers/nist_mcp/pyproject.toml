[project]
name = "nist-mcp"
version = "0.1.0"
description = "MCP server exposing NIST experimental reference data (Atomic Spectra Database + CODATA constants) with value, uncertainty, unit, and source."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp>=1.0",
    "scipy>=1.11,<1.14",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nist-mcp = "nist_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nist_mcp"]
